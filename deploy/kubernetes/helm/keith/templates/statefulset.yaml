apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "keith.fullname" . }}
  labels:
    {{- include "keith.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "keith.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "keith.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keith.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "keith.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keith
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 7341
              protocol: TCP
          env:
            - name: PORT
              value: "7341"
            - name: KEITH_PUBLIC_ORIGIN
              value: {{ required "config.publicOrigin is required" .Values.config.publicOrigin | quote }}
            - name: KEITH_SERVICES
              value: {{ .Values.config.services | quote }}
          envFrom:
            - secretRef:
                name: {{ required "config.existingSecret is required" .Values.config.existingSecret }}
          startupProbe:
            exec:
              command: ["keith-healthcheck"]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["keith-healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
            timeoutSeconds: 4
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/keith
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: workspace
          {{- if .Values.workspace.enabled }}
          persistentVolumeClaim:
            claimName: {{ required "workspace.existingClaim is required when workspace.enabled=true" .Values.workspace.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
