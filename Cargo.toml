[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/Sidiora-Labs/keith-agent"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
fs2 = "0.4.3"
os_pipe = "1.2.3"
nix = { version = "0.30.1", features = ["process", "signal"] }
proptest = "1.9.0"
rmp-serde = "1.3.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
signal-hook = "0.3.18"
thiserror = "2.0.18"
tempfile = "3.27.0"
toml = "0.9.8"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
ulid = "1.2.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
