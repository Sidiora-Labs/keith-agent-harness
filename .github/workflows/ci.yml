name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  tooling:
    name: Tooling and deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          install -d /tmp/keith-validators
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/keith-validators actionlint
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz \
            --output /tmp/helm.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Validate shell scripts
        run: |
          find . -type f -name '*.sh' -not -path './target/*' -not -path '*/node_modules/*' -print0 | xargs -0 bash -n
          find . -type f -name '*.sh' -not -path './target/*' -not -path '*/node_modules/*' -print0 | xargs -0 shellcheck
          bash -n ./keith
          shellcheck ./keith
          /tmp/keith-validators/actionlint -color
          ./keith help >/dev/null
      - name: Validate deployment manifests
        env:
          KEITH_WEB_LOGIN_SECRET: ci-login-secret-not-for-production
        run: |
          helm lint deploy/kubernetes/helm/keith
          helm template keith deploy/kubernetes/helm/keith >/tmp/keith-manifests.yaml
          docker compose config --quiet
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import tomllib

          json.loads(pathlib.Path('.devcontainer/devcontainer.json').read_text())
          tomllib.loads(pathlib.Path('deploy/fly/fly.toml').read_text())

          dockerfile = pathlib.Path('Dockerfile').read_text()
          for mount in re.finditer(r'--mount=([^\s\\]+)', dockerfile):
              options = dict(
                  option.split('=', 1)
                  for option in mount.group(1).split(',')
                  if '=' in option
              )
              if options.get('type') == 'cache':
                  line_number = dockerfile.count('\n', 0, mount.start()) + 1
                  raise SystemExit(
                      f'Dockerfile:{line_number}: provider-specific cache mounts are not portable'
                  )
          for line_number, line in enumerate(dockerfile.splitlines(), start=1):
              if line.lstrip().startswith('VOLUME '):
                  raise SystemExit(
                      f'Dockerfile:{line_number}: declare persistence in provider manifests, not VOLUME'
                  )

          railway_iac = pathlib.Path('.railway/railway.ts').read_text()
          required_mount = '"/var/lib/keith": volume('
          if required_mount not in railway_iac:
              raise SystemExit(
                  '.railway/railway.ts must mount a Railway volume at /var/lib/keith'
              )
          PY
      - name: Validate provider plans are non-mutating
        run: |
          ./keith deploy digitalocean >/dev/null
          ./keith deploy azure >/dev/null
          ./keith deploy aws >/dev/null
          ./keith deploy gcp --project keith-ci >/dev/null
          ./keith deploy fly >/dev/null

  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent-web/ui
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.22.2
      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run check
      - name: Test
        run: pnpm run test
      - name: Build static application
        run: pnpm run build

  rust:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/keith-ci-target
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> /tmp/keith-ci-target
      - name: Run the repository CI gate
        run: cargo ci
      - name: Prove clean-checkout reproducibility
        run: cargo clean-checkout

  platform:
    name: Platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../keith-platform-target
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.0
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run platform gate
        run: cargo platform-gate

  supply-chain:
    name: Supply chain and security
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: /tmp/keith-security-target
      KEITH_BUILD_ID: ci-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.0
      - name: Set up Node
        if: github.event_name == 'push'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.22.2
      - name: Enable locked pnpm
        if: github.event_name == 'push'
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - name: Install audit tools
        uses: taiki-e/install-action@541dbe11e2898b05bb65bedbd1d0c4e3092b5bdd # v2.67.29
        with:
          tool: cargo-deny@0.18.9,cargo-audit@0.21.2
      - name: Check dependency policy
        run: cargo deny check
      - name: Audit advisories
        run: cargo audit
      - name: Assemble signed security candidate
        if: github.event_name == 'push'
        env:
          KEITH_RELEASE_SIGNING_KEY: ${{ secrets.KEITH_RELEASE_SIGNING_KEY }}
          KEITH_RELEASE_PUBLIC_KEY: ${{ vars.KEITH_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          repository_key=$(tr -d '\r\n' < release-signing-public-key.hex)
          if [[ "$repository_key" != "$KEITH_RELEASE_PUBLIC_KEY" ]]; then
            echo "repository release key does not match the protected Actions variable" >&2
            exit 1
          fi
          release_directory="${RUNNER_TEMP}/keith-security-release"
          cargo xtask release "$release_directory"
          packaged_key=$(tr -d '\r\n' < "$release_directory/release-public-key.hex")
          if [[ "$packaged_key" != "$KEITH_RELEASE_PUBLIC_KEY" ]]; then
            echo "packaged release key does not match the trusted release key" >&2
            exit 1
          fi
          echo "KEITH_SECURITY_RELEASE_PATH=$release_directory" >> "$GITHUB_ENV"
          echo "KEITH_SECURITY_TRUSTED_PUBLIC_KEY=$KEITH_RELEASE_PUBLIC_KEY" >> "$GITHUB_ENV"
      - name: Run signed Keith security gate
        if: github.event_name == 'push'
        run: cargo security-gate

  container:
    name: OCI build and live smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build local image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          push: false
          tags: keith-agent:ci
          build-args: KEITH_BUILD_ID=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise daemon, web, session auth, and API bridge
        run: scripts/ci/container-smoke.sh keith-agent:ci 17341
