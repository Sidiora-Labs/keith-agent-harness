[package]
name = "keith-agent-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "agent-web"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
keith-agent-types = { path = "../../crates/agent-types" }
keith-protocol = { path = "../../crates/protocol" }
keith-ui-model = { path = "../../crates/ui-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum.workspace = true
futures-util.workspace = true
keith-connection = { path = "../../crates/connection" }
keith-credentials = { path = "../../crates/credentials" }
keith-framing = { path = "../../crates/framing" }
ring.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
js-sys.workspace = true
ulid.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
workspace = true
features = [
    "CloseEvent",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Location",
    "MessageEvent",
    "Node",
    "NodeList",
    "Request",
    "RequestInit",
    "Response",
    "WebSocket",
    "Window",
    "XmlHttpRequest",
]

[dev-dependencies]
tempfile.workspace = true
tungstenite.workspace = true
ureq.workspace = true
